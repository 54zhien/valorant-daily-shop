name: Build IPA

# 出未签名 IPA，手机上用自签工具装。
# 也可以在 Actions 页面手动触发（workflow_dispatch）。

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'val-shop-ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'val-shop-ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 1) 协议层单测：不需要账号、不联网、不需要签名，几十秒
  # ------------------------------------------------------------------
  test:
    name: ZhangwaKit 单元测试
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: 选用最新的 Xcode 26
        run: |
          set -euo pipefail
          echo "默认 Xcode: $(xcodebuild -version | head -1)"
          CANDIDATE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$CANDIDATE" ]; then
            sudo xcode-select -s "$CANDIDATE"
            echo "已切换到 $CANDIDATE"
          else
            echo "::warning::没找到 Xcode_26*.app，沿用默认版本"
          fi
          xcodebuild -version
          swift --version

      - name: swift test
        working-directory: val-shop-ios/ZhangwaKit
        run: swift test

      # 探针：把 Icon Composer 包直接丢给 actool，看它认不认这个手写格式。
      # continue-on-error —— 失败只留日志，不挡 IPA。跑通之后才敢把构建切到 .icon。
      - name: 试编译 Icon Composer 包（不阻塞构建）
        continue-on-error: true
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/icon-probe"
          mkdir -p "$OUT"
          echo "=== Icon/ 里有什么 ==="
          find val-shop-ios/Icon/ValPeek.icon -type f | sort

          echo "=== ① actool 直接吃 .icon 目录 ==="
          xcrun actool --compile "$OUT" --output-format human-readable-text \
            --notices --warnings \
            --app-icon ValPeek \
            --platform iphoneos --minimum-deployment-target 26.0 \
            --target-device iphone --target-device ipad \
            val-shop-ios/Icon/ValPeek.icon 2>&1 | tail -40
          echo "actool exit=${PIPESTATUS[0]}"

          echo "=== ② 兜底：先拷成 Assets.xcassets 平级的 AppIcon.icon 再试 ==="
          rm -rf "$RUNNER_TEMP/iconbundle" && mkdir -p "$RUNNER_TEMP/iconbundle"
          cp -R val-shop-ios/Icon/ValPeek.icon "$RUNNER_TEMP/iconbundle/AppIcon.icon"
          xcrun actool --compile "$OUT" --output-format human-readable-text \
            --notices --warnings \
            --app-icon AppIcon \
            --platform iphoneos --minimum-deployment-target 26.0 \
            --target-device iphone --target-device ipad \
            "$RUNNER_TEMP/iconbundle/AppIcon.icon" 2>&1 | tail -40
          echo "actool exit=${PIPESTATUS[0]}"

          echo "=== 产物 ==="
          ls -la "$OUT" || true

  # ------------------------------------------------------------------
  # 2) 构建未签名 IPA
  # ------------------------------------------------------------------
  build:
    name: 构建未签名 IPA
    needs: test
    runs-on: macos-26
    permissions:
      contents: write      # 下面要更新滚动 Release

    env:
      # 仓库 Settings → Secrets and variables → Actions → Variables 里可覆盖
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.imzhien.ValPeek' }}
      ZW_SHOP_PATH: ${{ vars.ZW_SHOP_PATH }}
      ZW_SHOP_BODY: ${{ vars.ZW_SHOP_BODY }}
      IPA_PATH: val-shop-ios/ValPeek-unsigned.ipa

    steps:
      - uses: actions/checkout@v5

      - name: 选用最新的 Xcode 26
        run: |
          set -euo pipefail
          CANDIDATE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$CANDIDATE" ]; then
            sudo xcode-select -s "$CANDIDATE"
          fi
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 写入构建期配置（商店接口路径）
        working-directory: val-shop-ios
        env:
          PATH_VALUE: ${{ vars.ZW_SHOP_PATH }}
          BODY_VALUE: ${{ vars.ZW_SHOP_BODY }}
          SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib, pathlib
          path = os.environ.get("PATH_VALUE", "").strip()
          body = os.environ.get("BODY_VALUE", "").strip() or "{}"
          sha = os.environ.get("SHA_VALUE", "").strip()[:7]
          out = pathlib.Path("App/BundledConfig.plist")
          # buildSHA 只是构建指纹：界面上「关于 → 版本」会显示它，
          # 用来分辨手机上装的到底是哪一次构建（不含任何凭据）。
          payload = {"shopPath": path, "shopBody": body, "buildSHA": sha}
          out.write_bytes(plistlib.dumps(payload))
          print(f"BundledConfig.plist -> shopPath={path or '(空)'} shopBody={body} buildSHA={sha or '(空)'}")
          PY

      - name: 生成 Xcode 工程
        working-directory: val-shop-ios
        env:
          PRODUCT_BUNDLE_IDENTIFIER: ${{ env.BUNDLE_ID }}
        run: |
          set -euo pipefail
          # project.yml 里读不到 env 时用默认值，这里直接 sed 覆盖 bundle id
          if [ -n "${PRODUCT_BUNDLE_IDENTIFIER:-}" ]; then
            sed -i '' "s|PRODUCT_BUNDLE_IDENTIFIER: .*|PRODUCT_BUNDLE_IDENTIFIER: ${PRODUCT_BUNDLE_IDENTIFIER}|" project.yml
          fi
          grep -n 'PRODUCT_BUNDLE_IDENTIFIER' project.yml
          xcodegen generate
          ls -la

      - name: 探针：生成的工程把 App Icon 指向谁
        working-directory: val-shop-ios
        continue-on-error: true
        run: |
          echo '=== pbxproj 里的 APPICON 设置 ==='
          grep -n 'ASSETCATALOG_COMPILER_APPICON_NAME' ValPeek.xcodeproj/project.pbxproj || true
          echo '=== pbxproj 里的 ValPeek.icon 引用 ==='
          grep -n 'ValPeek.icon' ValPeek.xcodeproj/project.pbxproj || true
          echo '=== 解析后的构建设置 ==='
          xcodebuild -project ValPeek.xcodeproj -scheme ValPeek -configuration Release -showBuildSettings 2>/dev/null | grep -i 'APPICON' || true

      - name: 构建（不签名）
        working-directory: val-shop-ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project ValPeek.xcodeproj \
            -scheme ValPeek \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: 打包成 IPA
        working-directory: val-shop-ios
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/ValPeek.app"
          test -d "$APP_PATH"

          rm -rf Payload "ValPeek-unsigned.ipa"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 自签工具会自己塞证书，所以这里确保没有残留签名
          rm -rf Payload/ValPeek.app/_CodeSignature
          rm -f  Payload/ValPeek.app/embedded.mobileprovision

          zip -qry "ValPeek-unsigned.ipa" Payload

          echo "--- 产物 ---"
          ls -lh ValPeek-unsigned.ipa
          echo "--- App 里的关键信息 ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist"

      - name: 上传 IPA
        uses: actions/upload-artifact@v7
        with:
          name: ValPeek-unsigned-ipa
          path: val-shop-ios/ValPeek-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # 手机上直接点链接下载 .ipa，不用登录 GitHub 翻 Artifacts（那边下下来是 zip，iOS 还得解压）
      - name: 更新滚动 Release（可直接下载的永久链接）
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="latest"
          TITLE="最新构建 $(date -u '+%Y-%m-%d %H:%M') UTC"
          NOTES=$(cat <<EOF
          未签名 IPA，用自签工具（ESign / 全能签 / AltStore）签名后安装。

          - Bundle ID: \`${BUNDLE_ID}\`
          - 商店接口路径: \`${ZW_SHOP_PATH:-（空，装好后在 App 里填）}\`
          - 提交: ${GITHUB_SHA:0:7}

          直链：\`https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/ValPeek-unsigned.ipa\`
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_PATH" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            echo "已更新 release/$TAG"
          else
            gh release create "$TAG" "$IPA_PATH" --title "$TITLE" --notes "$NOTES" --prerelease
            echo "已创建 release/$TAG"
          fi

      - name: 构建摘要
        if: always()
        run: |
          {
            echo "### 构建结果"
            echo ""
            echo "- Bundle ID: \`${BUNDLE_ID}\`"
            echo "- 商店接口路径: \`${ZW_SHOP_PATH:-（空，装好后在 App 里填）}\`"
            echo ""
            echo "**手机直接下：** https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/ValPeek-unsigned.ipa"
            echo ""
            echo "> 未签名 IPA，用手机上的自签工具签名后安装。"
          } >> "$GITHUB_STEP_SUMMARY"

# 说明
# ----
# · 跑在 macos-26 runner 上（自带 Xcode 26）。如果没有这个 label，
#   换成 macos-15 并手动指定 Xcode 26。
# · 产物是【未签名】IPA：去掉了 _CodeSignature 和 embedded.mobileprovision，
#   交给手机上的自签工具自己塞证书。
# · 想省掉在手机上手输商店接口路径，就到
#   Settings → Secrets and variables → Actions → Variables 建一个
#   ZW_SHOP_PATH 变量（值形如 /go/agame/asset/storefront），构建时会写进
#   App/BundledConfig.plist。

